name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mdbook
        env:
          MDBOOK_VERSION: '0.4.43'
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          install -m 755 mdbook /usr/local/bin/mdbook
      - name: Build book
        run: mdbook build website
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/book
      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/book

  # Pages deploy runs only once the repo variable PAGES_ENABLED is 'true'
  # (Pages needs a public repo or a paid plan). Until then the built site is
  # kept as a workflow artifact and attached to each tagged release.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
