name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install mdbook
        env:
          MDBOOK_VERSION: '0.4.43'
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          install -m 755 mdbook /usr/local/bin/mdbook
      - name: Build docs site
        run: |
          mdbook build website
          tar -czf "docs-site-$GITHUB_REF_NAME.tar.gz" -C website book
      - name: Check release notes
        run: node dist/src/cli.js release-check --tag "$GITHUB_REF_NAME" --json
      - name: Check tag and extract notes
        run: node dist/src/cli.js release-notes --tag "$GITHUB_REF_NAME" > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "docs-site-$GITHUB_REF_NAME.tar.gz"
